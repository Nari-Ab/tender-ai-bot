<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .terminal-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
      
      @keyframes fadeIn1 {
        0%, 100% { opacity: 0; transform: translateY(8px); }
        8%, 90% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn2 {
        0%, 15% { opacity: 0; transform: translateY(8px); }
        22%, 90% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn3 {
        0%, 30% { opacity: 0; transform: translateY(8px); }
        38%, 90% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseRisk {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #EF4444); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 10px #EF4444); }
      }
      
      .msg-1 { animation: fadeIn1 9s infinite ease-in-out; }
      .msg-2 { animation: fadeIn2 9s infinite ease-in-out; }
      .msg-3 { animation: fadeIn3 9s infinite ease-in-out; }
      .risk-badge { animation: pulseRisk 2.5s infinite ease-in-out; transform-origin: 380px 290px; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="560" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- macOS Window Bar -->
  <rect width="850" height="42" rx="18" fill="#1E293B" />
  <rect y="24" width="850" height="18" fill="#1E293B" />
  <line x1="0" y1="42" x2="850" y2="42" stroke="#334155" stroke-width="1" />
  
  <circle cx="26" cy="21" r="6" fill="#EF4444" />
  <circle cx="46" cy="21" r="6" fill="#F59E0B" />
  <circle cx="66" cy="21" r="6" fill="#10B981" />

  <text x="425" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#94A3B8">
    Telegram Bot · @TenderAISentinelBot — Аудит закупки № 0373100012324000999 (44-ФЗ)
  </text>

  <!-- Chat Area -->

  <!-- Message 1: User Document Upload -->
  <g class="msg-1" transform="translate(350, 60)">
    <rect width="460" height="60" rx="14" fill="#2563EB" opacity="0.9" />
    <!-- File Icon -->
    <rect x="18" y="14" width="24" height="32" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 32 14 L 42 24 L 32 24 Z" fill="#93C5FD"/>
    <text x="54" y="32" class="terminal-text" font-size="14" font-weight="700" fill="#FFFFFF">ТЗ_ЦОД_Поставка_Серверов.pdf</text>
    <text x="54" y="48" class="terminal-text" font-size="11" fill="#BFDBFE">48.2 МБ · PDF Document · Отправлен на экспресс-аудит</text>
  </g>

  <!-- Message 2: Sentinel Progress -->
  <g class="msg-2" transform="translate(40, 134)">
    <rect width="480" height="88" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="28" r="10" fill="#00F0FF" opacity="0.2"/>
    <text x="24" y="32" text-anchor="middle" font-size="12">🤖</text>
    
    <text x="46" y="28" class="terminal-text" font-size="13" font-weight="600" fill="#38BDF8">TenderAI Sentinel</text>
    <text x="46" y="48" class="terminal-text" font-size="12" fill="#94A3B8">⚡ [RAG Engine] Извлечено 48 страниц, 16 смысловых чанков</text>
    <text x="46" y="68" class="terminal-text" font-size="12" fill="#94A3B8">🧠 [Sber GigaChat API] Анализ юридических ловушек и штрафов...</text>
    <text x="46" y="88" class="terminal-text" font-size="12" fill="#10B981">✓ Анализ завершен (за 1.4с)</text>
  </g>

  <!-- Message 3: Final Risk Report Card -->
  <g class="msg-3" transform="translate(40, 236)">
    <!-- Report Bubble -->
    <rect width="770" height="300" rx="16" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.8" filter="url(#cardShadow)"/>
    
    <!-- Header Banner -->
    <rect width="770" height="44" rx="16" fill="#1E1E2E" />
    <rect y="28" width="770" height="16" fill="#1E1E2E" />
    <line x1="0" y1="44" x2="770" y2="44" stroke="#334155" stroke-width="1"/>

    <text x="22" y="28" class="terminal-text" font-size="14" font-weight="800" fill="#EF4444">
      ⛔️ РЕЗЮМЕ АНАЛИЗА ЗАКУПКИ № 0373100012324000999
    </text>

    <!-- Verdict Pill & Score -->
    <g class="risk-badge" transform="translate(22, 60)">
      <rect width="320" height="34" rx="17" fill="url(#dangerGrad)" />
      <text x="160" y="22" text-anchor="middle" class="terminal-text" font-size="13" font-weight="800" fill="#FFFFFF">
        ВЫСОКИЙ РИСК (НЕ УЧАСТВОВАТЬ)
      </text>
    </g>

    <g transform="translate(360, 60)">
      <rect width="180" height="34" rx="17" fill="#291419" stroke="#EF4444" stroke-width="1.2" />
      <text x="90" y="22" text-anchor="middle" class="terminal-text" font-size="13" font-weight="700" fill="#FCA5A5">
        🔴 Индекс риска: 95/100
      </text>
    </g>

    <g transform="translate(560, 60)">
      <rect width="190" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="95" y="22" text-anchor="middle" class="terminal-text" font-size="13" font-weight="600" fill="#93C5FD">
        💰 НМЦК: 48 000 000 ₽
      </text>
    </g>

    <!-- Key Findings Details -->
    <text x="24" y="125" class="terminal-text" font-size="13" font-weight="700" fill="#F8FAFC">
      🚨 Выявленные критические ловушки и кабальные условия:
    </text>

    <g transform="translate(24, 140)">
      <!-- Risk 1 -->
      <circle cx="8" cy="10" r="4" fill="#EF4444" />
      <text x="22" y="14" class="terminal-text" font-size="12" fill="#CBD5E1">
        <tspan font-weight="700" fill="#FCA5A5">[Сроки | CRITICAL]:</tspan> Срок поставки всего <tspan fill="#F87171" font-weight="700">3 календарных дня</tspan> с момента заключения (признак сговора).
      </text>

      <!-- Risk 2 -->
      <circle cx="8" cy="34" r="4" fill="#EF4444" />
      <text x="22" y="38" class="terminal-text" font-size="12" fill="#CBD5E1">
        <tspan font-weight="700" fill="#FCA5A5">[Штрафы | HIGH]:</tspan> Неустойка <tspan fill="#F87171" font-weight="700">2% в день (960 000 ₽/день)</tspan> — превышает ПП РФ №1042 в 20 раз!
      </text>

      <!-- Risk 3 -->
      <circle cx="8" cy="58" r="4" fill="#F59E0B" />
      <text x="22" y="62" class="terminal-text" font-size="12" fill="#CBD5E1">
        <tspan font-weight="700" fill="#FCD34D">[Обеспечение | HIGH]:</tspan> Обеспечение контракта 30% (14.4 млн ₽) исключительно живыми деньгами на счёт.
      </text>

      <!-- Risk 4 -->
      <circle cx="8" cy="82" r="4" fill="#38BDF8" />
      <text x="22" y="86" class="terminal-text" font-size="12" fill="#CBD5E1">
        <tspan font-weight="700" fill="#BAE6FD">[Лицензии | MEDIUM]:</tspan> Обязательна действующая лицензия ФСБ на работу с гостайной формы 2.
      </text>
    </g>

    <!-- Action Buttons Simulation -->
    <g transform="translate(24, 252)">
      <rect x="0" y="0" width="220" height="32" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.2" />
      <text x="110" y="20" text-anchor="middle" class="terminal-text" font-size="11" font-weight="700" fill="#38BDF8">
        📥 Скачать PDF-отчет для юриста
      </text>

      <rect x="235" y="0" width="180" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="325" y="20" text-anchor="middle" class="terminal-text" font-size="11" font-weight="600" fill="#E2E8F0">
        🌐 Открыть на ЕИС
      </text>

      <rect x="430" y="0" width="200" height="32" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="530" y="20" text-anchor="middle" class="terminal-text" font-size="11" font-weight="600" fill="#E2E8F0">
        ✍️ Сформировать протокол
      </text>
    </g>
  </g>
</svg>
