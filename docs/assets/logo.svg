<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#243B55" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Rounded Card -->
  <rect width="900" height="240" rx="28" fill="#0A0E17" stroke="#1E293B" stroke-width="2"/>

  <!-- Radar Grid Background Details -->
  <circle cx="130" cy="120" r="85" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="130" cy="120" r="55" fill="none" stroke="#334155" stroke-width="1.5" />
  <circle cx="130" cy="120" r="25" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.4" />

  <!-- Shield / Radar Logo Icon -->
  <g transform="translate(130, 120)">
    <!-- Hexagonal Sentinel Shield -->
    <path d="M 0 -60 L 52 -30 L 52 30 L 0 65 L -52 30 L -52 -30 Z" 
          fill="url(#shieldGrad)" stroke="url(#glowGrad)" stroke-width="3.5" filter="url(#neonBlur)"/>
    
    <!-- AI Core Node & Pulse Lines -->
    <circle cx="0" cy="0" r="14" fill="#00F0FF" filter="url(#neonBlur)">
      <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Radar Sweep Needle -->
    <line x1="0" y1="0" x2="35" y2="-35" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
    </line>

    <!-- Satellite Data Nodes -->
    <circle cx="-25" cy="-20" r="4" fill="#7000FF" />
    <circle cx="28" cy="18" r="4" fill="#FF007A" />
    <circle cx="-15" cy="35" r="3.5" fill="#00F0FF" />
  </g>

  <!-- Typography -->
  <text x="250" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="48" letter-spacing="-1" fill="#FFFFFF">
    TenderAI <tspan fill="url(#glowGrad)">Sentinel</tspan>
  </text>

  <text x="252" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="18" fill="#94A3B8" letter-spacing="0.2">
    Autonomous Procurement Intelligence &amp; Risk Scoring Engine
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(252, 168)">
    <!-- Pill 1: GigaChat / YandexGPT -->
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#1E293B" stroke="#334155" />
    <circle cx="14" cy="14" r="4" fill="#10B981" />
    <text x="26" y="19" font-family="monospace" font-size="12" fill="#E2E8F0" font-weight="600">GigaChat · YandexGPT</text>

    <!-- Pill 2: 44-FZ / 223-FZ -->
    <rect x="180" y="0" width="140" height="28" rx="14" fill="#1E293B" stroke="#334155" />
    <circle cx="194" cy="14" r="4" fill="#00F0FF" />
    <text x="206" y="19" font-family="monospace" font-size="12" fill="#E2E8F0" font-weight="600">ЕИС · 44/223-ФЗ</text>

    <!-- Pill 3: RAG Decision Engine -->
    <rect x="330" y="0" width="155" height="28" rx="14" fill="#1E293B" stroke="#334155" />
    <circle cx="344" cy="14" r="4" fill="#FF007A" />
    <text x="356" y="19" font-family="monospace" font-size="12" fill="#E2E8F0" font-weight="600">RAG Go / No-Go</text>
  </g>
</svg>
