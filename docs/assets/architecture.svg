<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="320" rx="16" fill="#0A0E17" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">
    TenderAI Sentinel Pipeline Architecture
  </text>

  <!-- Connector Lines -->
  <path d="M 190 160 L 250 160" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 390 160 L 450 160" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 590 160 L 650 160" stroke="#F43F5E" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Column 1: Sources -->
  <g transform="translate(30, 70)">
    <rect width="160" height="180" rx="12" fill="url(#boxGrad1)" stroke="#0284C7" stroke-width="1.5"/>
    <text x="80" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#38BDF8">ИСТОЧНИКИ</text>
    
    <rect x="15" y="48" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="69" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">ЕИС 44-ФЗ / 223-ФЗ</text>

    <rect x="15" y="90" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Сбербанк-АСТ</text>

    <rect x="15" y="132" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Файлы ТЗ (PDF/DOCX)</text>
  </g>

  <!-- Column 2: Document RAG -->
  <g transform="translate(230, 70)">
    <rect width="160" height="180" rx="12" fill="url(#boxGrad1)" stroke="#6366F1" stroke-width="1.5"/>
    <text x="80" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#818CF8">RAG &amp; ЧАНКИНГ</text>

    <rect x="15" y="48" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="69" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">pypdf / python-docx</text>

    <rect x="15" y="90" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Semantic Chunker</text>

    <rect x="15" y="132" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Clause Retriever</text>
  </g>

  <!-- Column 3: LLM Engine -->
  <g transform="translate(430, 70)">
    <rect width="160" height="180" rx="12" fill="url(#boxGrad1)" stroke="#EC4899" stroke-width="1.5"/>
    <text x="80" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#F472B6">LLM СКОРИНГ</text>

    <rect x="15" y="48" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="69" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Sber GigaChat API</text>

    <rect x="15" y="90" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">YandexGPT Cloud</text>

    <rect x="15" y="132" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Offline Mock Engine</text>
  </g>

  <!-- Column 4: Delivery -->
  <g transform="translate(630, 70)">
    <rect width="190" height="180" rx="12" fill="url(#boxGrad1)" stroke="#10B981" stroke-width="1.5"/>
    <text x="95" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#34D399">ДОСТАВКА ИНСАЙТОВ</text>

    <rect x="15" y="48" width="160" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="95" y="69" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Telegram Bot (aiogram 3)</text>

    <rect x="15" y="90" width="160" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="95" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Вердикт «Участвовать»</text>

    <rect x="15" y="132" width="160" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="95" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">FastAPI Webhooks</text>
  </g>
</svg>
